<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>감성사운드 업무 체크</title>
<style>
/* 세 개 탭(광고 효율 보고서 / 업무 리마인드 / 광고 마케팅 예정), 760px 단일 칼럼 */
:root{
  --bg:#EEF0F3; --surface:#FFFFFF; --border:#D4D8E0;
  --fg:#171B22; --muted:#5B6472; --muted-2:#8891A0;
  --accent:#C9601F; --accent-fg:#FFFFFF;
  --good:#1E8F74; --good-bg:#DFF3EC;
  --bad:#C0393F; --bad-bg:#FBE4E3;
  --warn:#8A6A00; --warn-bg:#FBF1CF;
  --chip-bg:#F4F5F8;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#13161C; --surface:#1B1F27; --border:#323948;
    --fg:#EDEEF2; --muted:#A3ABBA; --muted-2:#767F90;
    --accent:#E68A45; --accent-fg:#1B1206;
    --good:#49C9A6; --good-bg:#14312A;
    --bad:#F07872; --bad-bg:#3A1A1C;
    --warn:#E5C45A; --warn-bg:#3A3113;
    --chip-bg:#232833; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#13161C; --surface:#1B1F27; --border:#323948;
  --fg:#EDEEF2; --muted:#A3ABBA; --muted-2:#767F90;
  --accent:#E68A45; --accent-fg:#1B1206;
  --good:#49C9A6; --good-bg:#14312A;
  --bad:#F07872; --bad-bg:#3A1A1C;
  --warn:#E5C45A; --warn-bg:#3A3113;
  --chip-bg:#232833; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--fg);font-family:'Noto Sans KR','Malgun Gothic',system-ui,-apple-system,sans-serif;padding-bottom:56px;line-height:1.5}
a{color:inherit}
.wrap{max-width:760px;margin:0 auto;padding-inline:16px}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--border)}
.top-inner{max-width:760px;margin:0 auto;padding:14px 16px 0}
.title-row{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
h1{font-size:1.15rem;margin:0}
.sync{font-size:.72rem;color:var(--muted)}
.sync a{text-decoration:underline;text-underline-offset:2px}
nav.tabs{display:flex;gap:4px;overflow-x:auto;margin-top:10px}
nav.tabs button{appearance:none;border:0;background:none;color:var(--muted);font:inherit;font-size:.9rem;font-weight:700;padding:9px 12px;border-bottom:2px solid transparent;cursor:pointer;white-space:nowrap}
nav.tabs button[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--accent)}
nav.tabs button:focus-visible,button:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
section{display:none;padding-top:16px}
section.on{display:block}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px}
.stat{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:9px 11px;min-width:0}
.stat b{display:block;font-size:1.2rem;font-variant-numeric:tabular-nums}
.stat span{font-size:.72rem;color:var(--muted)}
h2{font-size:.84rem;color:var(--muted);font-weight:700;margin:22px 0 8px;display:flex;align-items:center;gap:8px}
h2 .dot{width:8px;height:8px;border-radius:50%;flex:none}
.list{background:var(--surface);border:1px solid var(--border);border-radius:12px;overflow:hidden}
.scroll{overflow-x:auto}
.item{display:flex;gap:10px;padding:11px 12px;border-top:1px solid var(--border);align-items:flex-start}
.item:first-child{border-top:0}
.item input{margin:3px 0 0;width:17px;height:17px;flex:none;accent-color:var(--accent)}
.item .body{flex:1;min-width:0}
.t{font-size:.92rem;font-weight:500;overflow-wrap:anywhere}
.note{font-size:.79rem;color:var(--muted);margin-top:2px;overflow-wrap:anywhere}
.why,.res{font-size:.8rem;margin-top:3px;display:flex;gap:6px}
.why b,.res b{flex:none;font-size:.7rem;padding:1px 6px;border-radius:5px;height:fit-content;margin-top:1px}
.why b{background:var(--chip-bg);color:var(--muted)}
.res b{background:var(--good-bg);color:var(--good)}
.item.local .t{text-decoration:line-through;color:var(--muted-2)}
.chips{display:flex;gap:5px;flex-wrap:wrap;margin-top:5px}
.chip{font-size:.68rem;font-weight:600;padding:1px 7px;border-radius:999px;background:var(--chip-bg);color:var(--muted);border:1px solid var(--border)}
.chip.due{background:var(--bad-bg);color:var(--bad);border-color:transparent}
.chip.old{background:var(--warn-bg);color:var(--warn);border-color:transparent}
.chip.ok{background:var(--good-bg);color:var(--good);border-color:transparent}
.day-h{font-size:.8rem;font-weight:700;padding:9px 12px;background:var(--chip-bg);border-top:1px solid var(--border)}
.list > .day-h:first-child{border-top:0}
.hint{font-size:.78rem;color:var(--muted);margin:8px 2px 0}
table{width:100%;border-collapse:collapse;font-size:.83rem;font-variant-numeric:tabular-nums}
th,td{text-align:left;padding:8px 10px;border-top:1px solid var(--border);vertical-align:top}
tr:first-child th{border-top:0;font-size:.72rem;color:var(--muted)}
td.num,th.num{text-align:right;white-space:nowrap}
td.d{text-align:center;width:36px;color:var(--muted-2)}
td.d.y{color:var(--good);font-weight:700}
.up{color:var(--good)} .down{color:var(--bad)}
.sub{font-size:.74rem;color:var(--muted)}
details.fold{margin-top:22px}
details.fold summary{cursor:pointer;font-size:.84rem;font-weight:700;color:var(--muted);padding:4px 2px}
.empty{padding:16px 12px;color:var(--muted);font-size:.85rem}
.copybar{display:none;position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--border);padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px))}
.copybar.on{display:block}
.copybar .in{max-width:760px;margin:0 auto;display:flex;gap:10px;align-items:center;justify-content:space-between;font-size:.82rem}
.copybar button{appearance:none;border:0;border-radius:8px;background:var(--accent);color:var(--accent-fg);font:inherit;font-weight:700;padding:8px 14px;cursor:pointer}
.copybox{width:100%;margin-top:8px;min-height:90px;font:inherit;font-size:.8rem;background:var(--bg);color:var(--fg);border:1px solid var(--border);border-radius:8px;padding:8px}
@media (prefers-reduced-motion: reduce){*{scroll-behavior:auto}}
</style>
</head>
<body>
<header class="top">
  <div class="top-inner">
    <div class="title-row">
      <h1>업무 체크 · <span id="today"></span></h1>
      <div class="sync" id="sync"></div>
    </div>
    <nav class="tabs" id="tabs" role="tablist"></nav>
  </div>
</header>
<main class="wrap">
  <section id="s-report"></section>
  <section id="s-remind"></section>
  <section id="s-plan"></section>
</main>
<div class="copybar" id="copybar"><div class="in"><span id="copymsg"></span><button id="copybtn" type="button">완료 목록 복사</button></div><div class="in" style="display:block"><textarea id="copybox" class="copybox" readonly hidden aria-label="복사할 완료 목록"></textarea></div></div>
<script src="data.js"></script>
<script>
(function(){
  var W = window.WORK, DAYS = ['일','월','화','수','목','금','토'];
  var esc = function(s){ return String(s == null ? '' : s).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); };
  var won = function(n){ return n == null ? '–' : Number(n).toLocaleString('ko-KR') + '원'; };
  var md = function(iso){ var d = new Date(iso + 'T00:00:00'); return (d.getMonth()+1) + '/' + d.getDate() + ' (' + DAYS[d.getDay()] + ')'; };
  var dot = function(c){ return '<span class="dot" style="background:' + c + '"></span>'; };
  var now = new Date(), todayDay = DAYS[now.getDay()];
  var KEY = 'work-check-' + W.meta.dayPage.title, local = {};
  try { local = JSON.parse(localStorage.getItem(KEY) || '{}'); } catch (e) {}
  var save = function(){ try { localStorage.setItem(KEY, JSON.stringify(local)); } catch (e) {} };

  document.getElementById('today').textContent = (now.getMonth()+1) + '/' + now.getDate() + ' (' + todayDay + ')';
  var s = new Date(W.meta.syncedAt);
  document.getElementById('sync').innerHTML = '마지막 갱신 ' + (s.getMonth()+1) + '/' + s.getDate() + ' ' + String(s.getHours()).padStart(2,'0') + ':' + String(s.getMinutes()).padStart(2,'0') +
    ' · <a href="' + esc(W.meta.dayPage.url) + '" target="_blank" rel="noopener">노션 ' + esc(W.meta.dayPage.title) + '</a>';

  var item = function(id, title, note, chips, extra){
    var cb = id ? '<input type="checkbox" data-id="' + esc(id) + '" data-title="' + esc(title) + '"' + (local[id] ? ' checked' : '') + '>' : '';
    return '<' + (id ? 'label' : 'div') + ' class="item' + (local[id] ? ' local' : '') + '">' + cb + '<div class="body"><div class="t">' + esc(title) + '</div>' +
      (note ? '<div class="note">' + esc(note) + '</div>' : '') + (extra || '') + (chips && chips.length ? '<div class="chips">' + chips.join('') + '</div>' : '') + '</div></' + (id ? 'label' : 'div') + '>';
  };
  var whyRes = function(a){ return (a.why ? '<div class="why"><b>이유</b><span>' + esc(a.why) + '</span></div>' : '') + (a.result ? '<div class="res"><b>결과</b><span>' + esc(a.result) + '</span></div>' : ''); };

  /* ---------- 광고 효율 보고서 ---------- */
  var A = W.ads, C = {};
  A.campaigns.forEach(function(c){ C[c.id] = c; });
  var dates = []; A.daily.forEach(function(r){ if (dates.indexOf(r.date) < 0) dates.push(r.date); }); dates.sort();
  var withCtr = dates.filter(function(d){ return A.daily.some(function(r){ return r.date === d && r.ctr != null; }); });
  var last = withCtr[withCtr.length - 1], prev = withCtr[withCtr.length - 2];
  var dayAgg = function(d){
    // CPC는 광고 관리자 값(소재별 CPC)을 클릭 수로 가중평균. 비용 칸은 일예산이라 당일 집계 중 클릭과 나누면 틀어짐
    var rs = A.daily.filter(function(r){ return r.date === d; }), cost = 0, clicks = 0, spent = 0;
    rs.forEach(function(r){ cost += r.cost || 0; if (r.clicks != null) { clicks += r.clicks; spent += r.clicks * r.cpc; } });
    return {cost: cost, clicks: clicks, cpc: clicks ? Math.round(spent / clicks) : null, partial: rs.some(function(r){ return r.partial; })};
  };
  var L = dayAgg(last), Pv = prev ? dayAgg(prev) : null;
  // 클릭 20건 미만은 CTR이 쉽게 튀므로 1위 후보에서 뺀다
  var best = A.daily.filter(function(r){ return r.date === last && r.ctr != null && r.clicks >= 20; }).sort(function(a,b){ return b.ctr - a.ctr; })[0];
  var r = '<div class="stats">' +
    '<div class="stat"><b>' + won(L.cost) + '</b><span>' + md(last) + ' 메타 트래픽 비용' + (L.partial ? ' (집계 중)' : '') + '</span></div>' +
    '<div class="stat"><b>' + L.clicks + '</b><span>클릭' + (Pv ? ' · 전날 ' + Pv.clicks : '') + '</span></div>' +
    '<div class="stat"><b>' + won(L.cpc) + '</b><span>평균 CPC' + (Pv ? ' · 전날 ' + won(Pv.cpc) : '') + '</span></div>' +
    '<div class="stat"><b>' + esc(best ? C[best.campaign].name : '–') + '</b><span>CTR 1위 ' + (best ? best.ctr.toFixed(2) + '% (클릭 20건 이상 중)' : '') + '</span></div></div>';

  r += '<h2>' + dot('var(--accent)') + '광고 동향 · 무엇을 알게 됐나</h2><div class="list">' +
    (A.insights || []).map(function(x){ return '<div class="day-h">' + md(x.date) + '</div>' + item(null, x.text); }).join('') + '</div>';

  var products = []; A.campaigns.forEach(function(c){ var k = (c.product || '기타') + ' · ' + (c.channel || ''); if (products.indexOf(k) < 0) products.push(k); });
  r += products.map(function(pk){
    var cs = A.campaigns.filter(function(c){ return ((c.product || '기타') + ' · ' + (c.channel || '')) === pk; });
    return '<h2>' + dot('var(--accent)') + '소재별 일별 성과 · ' + esc(pk) + '</h2><div class="list scroll"><table><tr><th>소재</th>' +
    dates.map(function(d){ return '<th class="num">' + md(d) + '</th>'; }).join('') + '</tr>' +
    cs.map(function(c){
      var prevCtr = null;
      return '<tr><td style="min-width:120px"><b>' + esc(c.name) + '</b><div class="sub">' + esc(c.angle) + '</div></td>' + dates.map(function(d){
        var x = A.daily.filter(function(q){ return q.date === d && q.campaign === c.id; })[0];
        if (!x) return '<td class="num sub">–</td>';
        var arrow = '';
        if (x.ctr != null && prevCtr != null) arrow = x.ctr > prevCtr ? ' <span class="up">▲</span>' : x.ctr < prevCtr ? ' <span class="down">▼</span>' : '';
        if (x.ctr != null) prevCtr = x.ctr;
        return '<td class="num">' + (x.ctr != null ? '<b>' + x.ctr.toFixed(2) + '%</b>' + arrow + '<div class="sub">' + x.clicks + '클릭 · ' + x.cpc + '원</div>' : '<span class="sub">CTR 없음</span>') +
          '<div class="sub">' + won(x.cost) + (x.partial ? ' *' : '') + '</div></td>';
      }).join('') + '</tr>';
    }).join('') + '</table></div>';
  }).join('') + '<p class="hint">칸 안: CTR / 클릭 · CPC / 그날 비용. * 표시는 당일 집계 중 캡처.</p>';

  r += '<h2>' + dot('var(--accent)') + '일별 광고 액션 · 이유와 결과</h2><div class="list">' +
    W.log.filter(function(g){ return !g.undated; }).map(function(g){
      var ads = g.items.filter(function(a){ return a.tag === '광고'; });
      if (!ads.length) return '';
      return '<div class="day-h">' + md(g.date) + '</div>' + ads.map(function(a){ return item(null, a.title, null, a.why === '이유 미기록' ? ['<span class="chip old">이유 적어 주세요</span>'] : [], whyRes(a)); }).join('');
    }).join('') + '</div>';

  r += '<h2>' + dot('var(--accent)') + 'A/B 테스트 · 왜 했고 무엇이 달랐나</h2><div class="list">' +
    A.tests.map(function(t){
      return '<div class="item"><div class="body"><div class="t">' + esc(t.name) + ' <span class="sub">' + esc(t.start) + '~</span></div>' +
        '<div class="why"><b>가설</b><span>' + esc(t.why) + '</span></div>' +
        t.variants.map(function(v){ return '<div class="note">· <b>' + esc(v.name) + '</b> — ' + esc(v.stat) + '</div>'; }).join('') +
        '<div class="res"><b>결과</b><span>' + esc(t.result) + '</span></div></div></div>';
    }).join('') + '</div>';

  var CD = A.channelDaily;
  r += '<h2>' + dot('var(--accent)') + '채널별 일 비용</h2><div class="list scroll"><table><tr><th>채널</th>' + CD.days.map(function(d){ return '<th class="num">' + esc(d) + '</th>'; }).join('') + '<th class="num">합계</th></tr>' +
    CD.rows.map(function(row){ var sum = row.v.reduce(function(a,b){ return a + b; }, 0); return '<tr><td style="min-width:130px"><b>' + esc(row.name) + '</b></td>' + row.v.map(function(v){ return '<td class="num' + (v ? '' : ' sub') + '">' + (v ? v.toLocaleString('ko-KR') : '0') + '</td>'; }).join('') + '<td class="num"><b>' + sum.toLocaleString('ko-KR') + '</b></td></tr>'; }).join('') +
    '<tr><td><b>합계</b></td>' + CD.days.map(function(_, i){ return '<td class="num"><b>' + CD.rows.reduce(function(a,row){ return a + row.v[i]; }, 0).toLocaleString('ko-KR') + '</b></td>'; }).join('') +
    '<td class="num"><b>' + CD.rows.reduce(function(a,row){ return a + row.v.reduce(function(x,y){ return x + y; }, 0); }, 0).toLocaleString('ko-KR') + '</b></td></tr></table></div>';

  var CS = W.consults, regSum = function(m){ return Object.keys(m.reg).reduce(function(a,k){ return a + m.reg[k]; }, 0); }, held = function(m){ return m.total - m.canceled - m.pending; };
  r += '<h2>' + dot('var(--good)') + '상담 → 등록 성과 (건수)</h2><div class="list scroll"><table><tr><th>월</th><th class="num">상담</th><th class="num">취소</th><th class="num">진행</th><th class="num">등록</th><th class="num">전환율</th><th>등록 내역</th></tr>' +
    CS.monthly.map(function(m){ var h = held(m), g = regSum(m); return '<tr><td><b>' + Number(m.month.slice(5)) + '월</b></td><td class="num">' + m.total + '</td><td class="num">' + m.canceled + '</td><td class="num">' + h + '</td><td class="num"><b>' + g + '</b></td><td class="num">' + (h ? Math.round(g / h * 100) + '%' : '–') + '</td><td class="sub" style="min-width:140px">' + esc(Object.keys(m.reg).map(function(k){ return k + ' ' + m.reg[k]; }).join(', ')) + '</td></tr>'; }).join('') +
    '</table></div><p class="hint">유입 경로별: ' + CS.bySource.map(function(x){ return esc(x.source) + ' ' + x.total + '건 중 등록 ' + x.registered; }).join(' · ') + '. ' + esc(CS.sourceNote) + '</p>';
  r += '<details class="fold"><summary>이번 달 상담 목록과 읽을 때 주의</summary><div class="list" style="margin-top:8px">' +
    CS.recent.map(function(x){ var reg = /신청 완료|3기 완료|판매/.test(x.status); return item(null, x.date.slice(5).replace('-', '/') + ' · ' + x.name, null, ['<span class="chip ' + (reg ? 'ok' : x.status === '시작 전' ? 'old' : '') + '">' + esc(x.status) + '</span>'].concat(x.source ? ['<span class="chip">' + esc(x.source) + '</span>'] : [])); }).join('') +
    CS.notes.map(function(n){ return item(null, '', n); }).join('') + '</div></details>';
  r += '<details class="fold"><summary>광고 수치 확인 필요</summary><div class="list" style="margin-top:8px">' + A.caveats.map(function(n){ return item(null, '', n); }).join('') + '</div><p class="hint">' + esc(A.metricsNote) + '</p></details>';
  document.getElementById('s-report').innerHTML = r;

  /* ---------- 업무 리마인드 ---------- */
  var taskChips = function(t){
    var c = ['<span class="chip">' + esc(t.tag) + '</span>'];
    if (t.due) c.push('<span class="chip due">~' + esc(t.due) + '</span>');
    c.push('<span class="chip' + (t.flag === 'old' ? ' old' : '') + '">' + esc(t.since) + (t.flag === 'old' ? '부터' : '') + '</span>');
    if (t.flag === 'dup') c.push('<span class="chip old">중복 항목</span>');
    if (t.flag === 'stale') c.push('<span class="chip old">낡은 항목?</span>');
    return c;
  };
  var GROUPS = [['today','오늘 꼭','var(--bad)'],['week','이번 주 안에','var(--warn)'],['wait','대기 · 급하지 않음','var(--muted-2)']];
  var fixedLeft = W.fixed.filter(function(f){ return f.checked.indexOf(todayDay) < 0; }).length;
  var m = '<div class="stats">' + [[W.tasks.length,'미완료'],[W.tasks.filter(function(t){ return t.group === 'today'; }).length,'오늘 꼭'],[W.missing.filter(function(x){ return x.kind === 'check'; }).length,'누락 후보'],[fixedLeft,'고정업무 남음']]
    .map(function(x){ return '<div class="stat"><b>' + x[0] + '</b><span>' + x[1] + '</span></div>'; }).join('') + '</div>';
  m += GROUPS.map(function(g){
    var ts = W.tasks.filter(function(t){ return t.group === g[0]; });
    return ts.length ? '<h2>' + dot(g[2]) + g[1] + ' · ' + ts.length + '</h2><div class="list">' + ts.map(function(t){ return item(t.id, t.title, t.note, taskChips(t)); }).join('') + '</div>' : '';
  }).join('');
  m += '<h2>' + dot('var(--good)') + '일별 내가 한 일</h2><div class="list">' + W.log.map(function(g){
    return '<div class="day-h">' + (g.undated ? esc(g.date) + ' · 노션에 완료 날짜 없음' : md(g.date)) + '</div>' + g.items.map(function(a){ return item(null, a.title, null, ['<span class="chip">' + esc(a.tag) + '</span>'], g.undated ? '' : whyRes(a)); }).join('');
  }).join('') + '</div>';
  m += '<h2>' + dot('var(--good)') + '고정 데일리 업무</h2><div class="list scroll"><table><tr><th>업무</th>' + ['월','화','수','목','금'].map(function(d){ return '<th style="text-align:center">' + d + '</th>'; }).join('') + '</tr>' +
    W.fixed.map(function(f){ return '<tr><td><b>' + esc(f.name) + '</b>' + (f.desc ? '<div class="sub">' + esc(f.desc) + '</div>' : '') + '</td>' + ['월','화','수','목','금'].map(function(d){ var y = f.checked.indexOf(d) >= 0; return '<td class="d' + (y ? ' y' : '') + '">' + (y ? '✓' : '·') + '</td>'; }).join('') + '</tr>'; }).join('') + '</table></div>';
  if (W.projects) {
    var PJ = W.projects.items.slice().sort(function(a,b){ return (a.lecture || a.open || '9') < (b.lecture || b.open || '9') ? -1 : 1; });
    m += '<h2>' + dot('var(--accent)') + '진행·예정 클래스와 프로젝트</h2><div class="list">' + PJ.map(function(p){
      var c = [];
      if (p.open) c.push('<span class="chip">오픈 ' + esc(md(p.open)) + '</span>');
      if (p.lecture) c.push('<span class="chip">수업 ' + esc(md(p.lecture)) + '</span>');
      if (p.who) c.push('<span class="chip">' + esc(p.who) + '</span>');
      return item(null, p.name, p.note, c);
    }).join('') + '</div><p class="hint">' + esc(W.projects.note) + '</p>';
  }
  var byDay = {}; W.schedule.forEach(function(e){ (byDay[e.date] = byDay[e.date] || []).push(e); });
  m += '<h2>' + dot('var(--muted-2)') + '다가오는 일정</h2><div class="list">' + Object.keys(byDay).sort().map(function(d){
    return '<div class="day-h">' + md(d) + '</div>' + byDay[d].map(function(e){ return item(null, (e.time ? e.time + ' · ' : '') + e.title); }).join('');
  }).join('') + '</div>';
  var mk = function(k){ return W.missing.filter(function(x){ return x.kind === k; }); };
  m += '<details class="fold"><summary>누락 점검 · 예전 페이지에서 체크 없이 사라진 ' + mk('check').length + '개</summary><div class="list" style="margin-top:8px">' +
    mk('check').map(function(x, i){ return item('m' + i, x.title, x.note, ['<span class="chip">마지막: ' + esc(x.lastSeen) + '</span>']); }).join('') + '</div>' +
    '<p class="hint">날짜가 지난 것으로 보이는 ' + mk('expired').length + '개: ' + mk('expired').map(function(x){ return esc(x.title); }).join(' / ') + '</p></details>';
  m += '<p class="hint">체크는 이 브라우저에만 남습니다. "완료 목록 복사"로 클로드에게 붙여 넣으면 노션과 사이트에 반영합니다.</p>';
  document.getElementById('s-remind').innerHTML = m;

  /* ---------- 광고 마케팅 예정 ---------- */
  var dated = W.plans.filter(function(p){ return p.date; }).sort(function(a,b){ return a.date < b.date ? -1 : 1; }), open = W.plans.filter(function(p){ return !p.date; });
  var planItem = function(p){ return item(null, p.title, p.why, ['<span class="chip">' + esc(p.channel) + '</span>', '<span class="chip' + (p.status === '대기' ? ' old' : '') + '">' + esc(p.status) + '</span>'].concat(p.est ? ['<span class="chip old">날짜 추정</span>'] : [])); };
  var dg = {}; dated.forEach(function(p){ (dg[p.date] = dg[p.date] || []).push(p); });
  var pl = '<h2>' + dot('var(--accent)') + '날짜가 정해진 것</h2><div class="list">' + Object.keys(dg).sort().map(function(d){
    var diff = Math.round((new Date(d + 'T00:00:00') - new Date(now.getFullYear(), now.getMonth(), now.getDate())) / 864e5);
    return '<div class="day-h">' + md(d) + (diff === 0 ? ' · 오늘' : diff > 0 ? ' · D-' + diff : ' · 지남') + '</div>' + dg[d].map(planItem).join('');
  }).join('') + '</div>';
  pl += '<h2>' + dot('var(--muted-2)') + '날짜 미정 · 판단 대기</h2><div class="list">' + open.map(planItem).join('') + '</div>';
  document.getElementById('s-plan').innerHTML = pl;

  /* ---------- 탭 ---------- */
  var TABS = [['report','광고 효율 보고서'],['remind','업무 리마인드'],['plan','광고 마케팅 예정']];
  var tabs = document.getElementById('tabs');
  tabs.innerHTML = TABS.map(function(t){ return '<button role="tab" type="button" data-t="' + t[0] + '">' + t[1] + '</button>'; }).join('');
  var show = function(id){
    TABS.forEach(function(t){ document.getElementById('s-' + t[0]).classList.toggle('on', t[0] === id); });
    [].forEach.call(tabs.children, function(b){ b.setAttribute('aria-selected', b.dataset.t === id); });
    try { localStorage.setItem('work-check-tab', id); } catch (e) {}
  };
  tabs.addEventListener('click', function(e){ var b = e.target.closest('button'); if (b) show(b.dataset.t); });
  var start = (location.hash || '').slice(1); if (!TABS.some(function(t){ return t[0] === start; })) { try { start = localStorage.getItem('work-check-tab'); } catch (e) {} }
  show(TABS.some(function(t){ return t[0] === start; }) ? start : 'report');

  /* ---------- 체크 → 복사 ---------- */
  var bar = document.getElementById('copybar');
  var refresh = function(){ var n = Object.keys(local).length; bar.classList.toggle('on', n > 0); document.getElementById('copymsg').textContent = n + '개 완료 표시 (노션 미반영)'; };
  document.addEventListener('change', function(e){
    var cb = e.target; if (!cb.dataset || !cb.dataset.id) return;
    if (cb.checked) local[cb.dataset.id] = cb.dataset.title; else delete local[cb.dataset.id];
    cb.closest('.item').classList.toggle('local', cb.checked); save(); refresh();
  });
  document.getElementById('copybtn').addEventListener('click', function(){
    var txt = '노션 ' + W.meta.dayPage.title + ' 페이지에서 아래 항목 완료 체크해줘:\n' + Object.keys(local).map(function(k){ return '- ' + local[k]; }).join('\n');
    var btn = document.getElementById('copybtn'), box = document.getElementById('copybox');
    var done = function(){ btn.textContent = '복사됨'; setTimeout(function(){ btn.textContent = '완료 목록 복사'; }, 1500); };
    var fallback = function(){ box.value = txt; box.hidden = false; box.focus(); box.select(); document.getElementById('copymsg').textContent = '아래 글을 선택해 복사(Ctrl+C)하세요'; };
    try { if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(txt).then(done, fallback); else fallback(); } catch (e) { fallback(); }
  });
  refresh();
})();
</script>
</body>
</html>
