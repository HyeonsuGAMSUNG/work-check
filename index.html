<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<title>감성사운드 업무 체크</title>
<style>
/* 세 개 탭(광고 효율 보고서 / 업무 리마인드 / 광고 마케팅 예정), 760px 단일 칼럼 */
:root{
  --bg:#EEF0F3; --surface:#FFFFFF; --border:#D4D8E0;
  --fg:#171B22; --muted:#5B6472; --muted-2:#8891A0;
  --accent:#C9601F; --accent-fg:#FFFFFF;
  --good:#1E8F74; --good-bg:#DFF3EC;
  --bad:#C0393F; --bad-bg:#FBE4E3;
  --warn:#8A6A00; --warn-bg:#FBF1CF;
  --chip-bg:#F4F5F8;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#13161C; --surface:#1B1F27; --border:#323948;
    --fg:#EDEEF2; --muted:#A3ABBA; --muted-2:#767F90;
    --accent:#E68A45; --accent-fg:#1B1206;
    --good:#49C9A6; --good-bg:#14312A;
    --bad:#F07872; --bad-bg:#3A1A1C;
    --warn:#E5C45A; --warn-bg:#3A3113;
    --chip-bg:#232833; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#13161C; --surface:#1B1F27; --border:#323948;
  --fg:#EDEEF2; --muted:#A3ABBA; --muted-2:#767F90;
  --accent:#E68A45; --accent-fg:#1B1206;
  --good:#49C9A6; --good-bg:#14312A;
  --bad:#F07872; --bad-bg:#3A1A1C;
  --warn:#E5C45A; --warn-bg:#3A3113;
  --chip-bg:#232833; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--fg);font-family:'Noto Sans KR','Malgun Gothic',system-ui,-apple-system,sans-serif;padding-bottom:56px;line-height:1.5}
a{color:inherit}
.wrap{max-width:760px;margin:0 auto;padding-inline:16px}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--border)}
.top-inner{max-width:760px;margin:0 auto;padding:14px 16px 0}
.title-row{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
h1{font-size:1.15rem;margin:0}
.sync{font-size:.72rem;color:var(--muted)}
.sync a{text-decoration:underline;text-underline-offset:2px}
nav.tabs{display:flex;gap:4px;overflow-x:auto;margin-top:10px}
nav.tabs button{appearance:none;border:0;background:none;color:var(--muted);font:inherit;font-size:.9rem;font-weight:700;padding:9px 12px;border-bottom:2px solid transparent;cursor:pointer;white-space:nowrap}
nav.tabs button[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--accent)}
nav.tabs button:focus-visible,button:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
section{display:none;padding-top:16px}
section.on{display:block}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px}
.stat{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:9px 11px;min-width:0}
.stat b{display:block;font-size:1.2rem;font-variant-numeric:tabular-nums}
.stat span{font-size:.72rem;color:var(--muted)}
h2{font-size:.84rem;color:var(--muted);font-weight:700;margin:22px 0 8px;display:flex;align-items:center;gap:8px}
h2 .dot{width:8px;height:8px;border-radius:50%;flex:none}
.list{background:var(--surface);border:1px solid var(--border);border-radius:12px;overflow:hidden}
.scroll{overflow-x:auto}
.item{display:flex;gap:10px;padding:11px 12px;border-top:1px solid var(--border);align-items:flex-start}
.item:first-child{border-top:0}
.item input{margin:3px 0 0;width:17px;height:17px;flex:none;accent-color:var(--accent)}
.item .body{flex:1;min-width:0}
.t{font-size:.92rem;font-weight:500;overflow-wrap:anywhere}
.note{font-size:.79rem;color:var(--muted);margin-top:2px;overflow-wrap:anywhere}
.why,.res{font-size:.8rem;margin-top:3px;display:flex;gap:6px}
.why b,.res b{flex:none;font-size:.7rem;padding:1px 6px;border-radius:5px;height:fit-content;margin-top:1px}
.why b{background:var(--chip-bg);color:var(--muted)}
.res b{background:var(--good-bg);color:var(--good)}
.item.local .t{text-decoration:line-through;color:var(--muted-2)}
.chips{display:flex;gap:5px;flex-wrap:wrap;margin-top:5px}
.chip{font-size:.68rem;font-weight:600;padding:1px 7px;border-radius:999px;background:var(--chip-bg);color:var(--muted);border:1px solid var(--border)}
.chip.due{background:var(--bad-bg);color:var(--bad);border-color:transparent}
.chip.old{background:var(--warn-bg);color:var(--warn);border-color:transparent}
.chip.ok{background:var(--good-bg);color:var(--good);border-color:transparent}
.day-h{font-size:.8rem;font-weight:700;padding:9px 12px;background:var(--chip-bg);border-top:1px solid var(--border)}
.list > .day-h:first-child{border-top:0}
.hint{font-size:.78rem;color:var(--muted);margin:8px 2px 0}
table{width:100%;border-collapse:collapse;font-size:.83rem;font-variant-numeric:tabular-nums}
th,td{text-align:left;padding:8px 10px;border-top:1px solid var(--border);vertical-align:top}
tr:first-child th{border-top:0;font-size:.72rem;color:var(--muted)}
td.num,th.num{text-align:right;white-space:nowrap}
td.d{text-align:center;width:36px;color:var(--muted-2)}
td.d.y{color:var(--good);font-weight:700}
.up{color:var(--good)} .down{color:var(--bad)}
.sub{font-size:.74rem;color:var(--muted)}
/* 광고비 장부: 첫 칸(캠페인)은 가로 스크롤해도 고정 */
table.book td:first-child,table.book th:first-child{position:sticky;left:0;background:var(--surface);z-index:1;box-shadow:1px 0 0 var(--border)}
table.book td.grp{background:var(--chip-bg);font-size:.8rem;position:sticky;left:0;white-space:nowrap}
table.book td.grp2{background:var(--chip-bg)}
table.book td.num,table.book th.num{padding-inline:14px;min-width:96px;border-left:1px solid var(--border)}
table.book tr:nth-child(even) td:not(.grp):not(.grp2){background-image:linear-gradient(var(--chip-bg),var(--chip-bg))}
.chip.t-tr{background:var(--good-bg);color:var(--good);border-color:transparent}
.chip.t-ld{background:var(--warn-bg);color:var(--warn);border-color:transparent}
.chip.t-bo{background:var(--bad-bg);color:var(--bad);border-color:transparent}
details.fold{margin-top:22px}
details.fold summary{cursor:pointer;font-size:.84rem;font-weight:700;color:var(--muted);padding:4px 2px}
.empty{padding:16px 12px;color:var(--muted);font-size:.85rem}
.copybar{display:none;position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--border);padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px))}
.copybar.on{display:block}
.copybar .in{max-width:760px;margin:0 auto;display:flex;gap:10px;align-items:center;justify-content:space-between;font-size:.82rem}
.copybar button{appearance:none;border:0;border-radius:8px;background:var(--accent);color:var(--accent-fg);font:inherit;font-weight:700;padding:8px 14px;cursor:pointer}
.copybox{width:100%;margin-top:8px;min-height:90px;font:inherit;font-size:.8rem;background:var(--bg);color:var(--fg);border:1px solid var(--border);border-radius:8px;padding:8px}
@media (prefers-reduced-motion: reduce){*{scroll-behavior:auto}}
.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.adcard{background:var(--surface);border:1px solid var(--border);border-radius:12px;overflow:hidden;display:flex;flex-direction:column}
.adcard .shot{background:var(--chip-bg);aspect-ratio:4/5;display:flex;align-items:center;justify-content:center;overflow:hidden}
.adcard .shot img{width:100%;height:100%;object-fit:contain;cursor:zoom-in}
.adcard .shot .none{font-size:.75rem;color:var(--muted-2);text-align:center;padding:12px}
.adcard .info{padding:10px 12px;display:flex;flex-direction:column;gap:4px}
.adcard .info b{font-size:.88rem}
.adcard .copy{font-size:.74rem;color:var(--muted);white-space:pre-line;border-left:2px solid var(--border);padding-left:8px}
.zoom{position:fixed;inset:0;background:rgba(0,0,0,.8);display:none;align-items:center;justify-content:center;z-index:50;padding:16px}
.zoom.on{display:flex}.zoom img{max-width:100%;max-height:100%;border-radius:8px}
</style>
</head>
<body>
<header class="top">
  <div class="top-inner">
    <div class="title-row">
      <h1>업무 체크 · <span id="today"></span></h1>
      <div class="sync" id="sync"></div>
    </div>
    <nav class="tabs" id="tabs" role="tablist"></nav>
  </div>
</header>
<main class="wrap">
  <section id="s-report"></section>
  <section id="s-remind"></section>
  <section id="s-daily"></section>
  <section id="s-consult"></section>
  <section id="s-promo"></section>
  <section id="s-plan"></section>
</main>
<div class="copybar" id="copybar"><div class="in"><span id="copymsg"></span><button id="copybtn" type="button">완료 목록 복사</button></div><div class="in" style="display:block"><textarea id="copybox" class="copybox" readonly hidden aria-label="복사할 완료 목록"></textarea></div></div>
<script src="data.js?v=1792245655"></script>
<script>
(function(){
  var W = window.WORK, DAYS = ['일','월','화','수','목','금','토'];
  var esc = function(s){ return String(s == null ? '' : s).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); };
  var won = function(n){ return n == null ? '–' : Number(n).toLocaleString('ko-KR') + '원'; };
  var md = function(iso){ var d = new Date(iso + 'T00:00:00'); return (d.getMonth()+1) + '/' + d.getDate() + ' (' + DAYS[d.getDay()] + ')'; };
  var dot = function(c){ return '<span class="dot" style="background:' + c + '"></span>'; };
  var now = new Date(), todayDay = DAYS[now.getDay()];
  var KEY = 'work-check-' + W.meta.dayPage.title, local = {};
  try { local = JSON.parse(localStorage.getItem(KEY) || '{}'); } catch (e) {}
  var save = function(){ try { localStorage.setItem(KEY, JSON.stringify(local)); } catch (e) {} };

  document.getElementById('today').textContent = (now.getMonth()+1) + '/' + now.getDate() + ' (' + todayDay + ')';
  var s = new Date(W.meta.syncedAt);
  document.getElementById('sync').innerHTML = '마지막 갱신 ' + (s.getMonth()+1) + '/' + s.getDate() + ' ' + String(s.getHours()).padStart(2,'0') + ':' + String(s.getMinutes()).padStart(2,'0') +
    ' · <a href="' + esc(W.meta.dayPage.url) + '" target="_blank" rel="noopener">노션 ' + esc(W.meta.dayPage.title) + '</a>';

  var item = function(id, title, note, chips, extra){
    var cb = id ? '<input type="checkbox" data-id="' + esc(id) + '" data-title="' + esc(title) + '"' + (local[id] ? ' checked' : '') + '>' : '';
    return '<' + (id ? 'label' : 'div') + ' class="item' + (local[id] ? ' local' : '') + '">' + cb + '<div class="body"><div class="t">' + esc(title) + '</div>' +
      (note ? '<div class="note">' + esc(note) + '</div>' : '') + (extra || '') + (chips && chips.length ? '<div class="chips">' + chips.join('') + '</div>' : '') + '</div></' + (id ? 'label' : 'div') + '>';
  };
  var whyRes = function(a){ return (a.why ? '<div class="why"><b>이유</b><span>' + esc(a.why) + '</span></div>' : '') + (a.result ? '<div class="res"><b>결과</b><span>' + esc(a.result) + '</span></div>' : ''); };

  /* ---------- 광고 효율 보고서 ---------- */
  var A = W.ads, C = {};
  A.campaigns.forEach(function(c){ C[c.id] = c; });
  var dates = []; A.daily.forEach(function(r){ if (dates.indexOf(r.date) < 0) dates.push(r.date); }); dates.sort();
  var withCtr = dates.filter(function(d){ return A.daily.some(function(r){ return r.date === d && r.ctr != null; }); });
  var last = withCtr[withCtr.length - 1], prev = withCtr[withCtr.length - 2];
  var dayAgg = function(d){
    // CPC는 광고 관리자 값(소재별 CPC)을 클릭 수로 가중평균. 비용 칸은 일예산이라 당일 집계 중 클릭과 나누면 틀어짐
    var rs = A.daily.filter(function(r){ return r.date === d; }), cost = 0, clicks = 0, spent = 0;
    rs.forEach(function(r){ cost += r.cost || 0; if (r.clicks != null) { clicks += r.clicks; spent += r.clicks * r.cpc; } });
    return {cost: cost, clicks: clicks, cpc: clicks ? Math.round(spent / clicks) : null, partial: rs.some(function(r){ return r.partial; })};
  };
  var L = dayAgg(last), Pv = prev ? dayAgg(prev) : null;
  // 클릭 20건 미만은 CTR이 쉽게 튀므로 1위 후보에서 뺀다
  var best = A.daily.filter(function(r){ return r.date === last && r.ctr != null && r.clicks >= 20; }).sort(function(a,b){ return b.ctr - a.ctr; })[0];
  var B = A.book, M = A.meta14;
  // 일별 액션 옆에 붙이는 그날 수치: 날짜 줄 = 전체 광고비 + 메타 트래픽 CTR(노출 역산 가중), 항목 = 해당 캠페인
  var bookDay = function(d, f){ var i = B.days.indexOf(d); if (i < 0) return null; var t = 0; B.groups.forEach(function(g){ g.rows.forEach(function(x){ if (!f || f(x)) t += x.v[i]; }); }); return t; };
  var daySum = function(d){
    var rs = A.daily.filter(function(x){ return x.date === d && x.ctr; }), clk = 0, imp = 0;
    rs.forEach(function(x){ clk += x.clicks; imp += x.clicks / (x.ctr / 100); });
    var tot = bookDay(d);
    if (tot == null && !rs.length) return '';
    return '<span class="sub" style="font-weight:500">' + (tot != null ? ' · 광고비 ' + won(tot) : '') + (rs.length ? ' · 송세션 메타 CTR ' + (clk / imp * 100).toFixed(2) + '% · 클릭 ' + clk : '') + '</span>';
  };
  // 광고비 표 칸의 CTR: 송세션은 캡처(링크 CTR, ads.daily), 나머지는 메타 내보내기(전체 CTR, ads.meta14)
  var cellCtr = function(x, d){
    if (x.cid) { var q = A.daily.filter(function(r){ return r.date === d && r.campaign === x.cid; })[0]; return q && q.ctr != null ? q.ctr : null; }
    if (x.meta && d === M.date) { var m = M.rows.filter(function(r){ return r.name === x.meta; })[0]; return m && m.ctr != null && m.spent ? m.ctr : null; }
    return null;
  };
  var adStat = function(d, a){
    var t = '';
    if (a.campaign) {
      var x = A.daily.filter(function(q){ return q.date === d && q.campaign === a.campaign; })[0];
      if (x) t = '그날 ' + won(x.cost) + (x.ctr != null ? ' · CTR ' + x.ctr.toFixed(2) + '% · ' + x.clicks + '클릭 · CPC ' + x.cpc + '원' : ' · CTR 캡처 없음') + (x.partial ? ' *' : '');
    } else if (a.book) {
      var v = bookDay(d, function(r){ return r.name.indexOf(a.book) >= 0; });
      if (v != null) t = '그날 ' + won(v) + ' · CTR 캡처 없음';
    }
    return t ? '<div class="note" style="color:var(--fg)">📊 ' + esc(t) + '</div>' : '';
  };
  var sumv = function(v){ return v.reduce(function(a,b){ return a + b; }, 0); };
  var bySum = function(f){ return B.groups.reduce(function(a,g){ return a + g.rows.reduce(function(x,row){ return x + (f(g, row) ? sumv(row.v) : 0); }, 0); }, 0); };
  var typeChip = function(x){ var c = x.type === '트래픽' ? 't-tr' : x.type === '잠재고객' ? 't-ld' : 't-bo'; return '<span class="chip ' + c + '">' + esc(x.type + (x.aud ? ' ' + x.aud : '')) + '</span>'; };
  var dRange = md(B.days[0]).split(' ')[0] + '~' + md(B.days[B.days.length - 1]).split(' ')[0];
  // 최상단 요약: 국가별 / 채널(앱)별 광고비 한 줄씩, 비중 막대
  var TOT = bySum(function(){ return true; });
  var app = function(x){ return x.type === 'X' ? 'X' : x.type === 'BOOST' ? '인스타 BOOST' : '메타 광고'; };
  var sumRows = function(title, rows){
    return '<div class="list" style="flex:1;min-width:260px"><table><tr><th>' + title + '</th><th class="num">광고비</th><th class="num">비중</th></tr>' +
      rows.map(function(x){ var p = TOT ? x[1] / TOT * 100 : 0;
        return '<tr><td><b style="white-space:nowrap">' + esc(x[0]) + '</b>' + (x[2] ? '<div class="sub">' + esc(x[2]) + '</div>' : '') + '</td><td class="num" style="font-size:.95rem"><b>' + won(x[1]) + '</b></td>' +
          '<td class="num" style="width:84px"><div style="display:flex;align-items:center;gap:5px;justify-content:flex-end"><span style="display:inline-block;height:6px;border-radius:3px;background:var(--accent);width:' + Math.max(p * .4, x[1] ? 2 : 0) + 'px"></span>' + Math.round(p) + '%</div></td></tr>';
      }).join('') + '<tr><td><b>합계</b></td><td class="num" style="font-size:.95rem"><b>' + won(TOT) + '</b></td><td class="num">100%</td></tr></table></div>';
  };
  var ctry = ['한국','일본','미국'].map(function(cn){ return [cn, bySum(function(g){ return g.country === cn; }), cn === '미국' ? '아직 집행 없음' : '']; });
  var apps = ['메타 광고','인스타 BOOST','X'].map(function(a){
    return [a, bySum(function(g, x){ return app(x) === a; }), a === '메타 광고' ? '트래픽 ' + won(bySum(function(g, x){ return x.type === '트래픽'; })) + ' · 잠재고객 ' + won(bySum(function(g, x){ return x.type === '잠재고객'; })) : a === 'X' ? '일본 송세션, 10/14 중단' : '일본 송세션'];
  });
  var r = '<h2 style="margin-top:4px">' + dot('var(--accent)') + dRange + ' 광고비 ' + won(TOT) + '</h2>' +
    '<div style="display:flex;gap:10px;flex-wrap:wrap">' + sumRows('국가별', ctry) + sumRows('채널(앱)별', apps) + '</div>';

  // 최근 판단: 캠페인별 끄기/축소/유지/증액 (CTR보다 결과당 비용 기준)
  if (A.review) {
    var RV = A.review, VC = {'증액':'ok','유지':'','축소':'old','끄기':'due','확인':'old','꺼짐':''};
    var VO = ['증액','유지','축소','확인','끄기','꺼짐'];
    r += '<h2>' + dot('var(--bad)') + '최근 판단 · ' + esc(RV.period) + '</h2><div class="list"><div class="item"><div class="body"><div class="t"><b>결론: ' + esc(RV.answer) + '</b></div>' +
      RV.reasons.map(function(x){ return '<div class="note">· ' + esc(x) + '</div>'; }).join('') + '</div></div></div>';
    ['일본','한국'].forEach(function(cn){
      var rs = RV.rows.filter(function(x){ return x.country === cn; }).sort(function(a,b){ return VO.indexOf(a.verdict) - VO.indexOf(b.verdict); });
      var cnt = {}; rs.forEach(function(x){ cnt[x.verdict] = (cnt[x.verdict] || 0) + 1; });
      r += '<h2 style="font-weight:500">' + esc(cn) + ' · ' + VO.filter(function(v){ return cnt[v]; }).map(function(v){ return v + ' ' + cnt[v]; }).join(' · ') + '</h2><div class="list scroll"><table class="book"><tr><th>캠페인 · 판단 이유</th><th class="num">판단</th><th class="num">결과당</th><th class="num">CTR</th><th class="num">결과</th><th class="num">지출</th></tr>' +
        rs.map(function(x){
          return '<tr' + (x.verdict === '꺼짐' ? ' style="opacity:.55"' : '') + '><td style="min-width:240px;max-width:320px"><div class="t" style="font-size:.84rem">' + esc(x.name) + '</div><div class="chips"><span class="chip">' + esc(x.product) + '</span></div><div class="sub" style="margin-top:3px">' + esc(x.why) + '</div></td>' +
            '<td class="num"><span class="chip ' + (VC[x.verdict] || '') + '" style="font-size:.78rem">' + esc(x.verdict) + '</span></td>' +
            '<td class="num"><b>' + (x.cpr != null ? won(x.cpr) : '–') + '</b></td><td class="num">' + x.ctr.toFixed(2) + '%</td>' +

      (m.open.length ? '<div class="day-h">아직 결과 없음 · ' + m.open.length + '건</div>' + m.open.map(function(o){ return item(null, md(o.date) + ' · ' + o.name, null, ['<span class="chip ' + (o.status === '시작 전' ? 'old' : '') + '">' + esc(o.status) + '</span>'].concat(o.source ? ['<span class="chip">' + esc(o.source) + '</span>'] : [])); }).join('') : '') + '</div>';
  });
  cs += '<h2>' + dot('var(--muted-2)') + '유입 경로별 (9/15 이후 기록분)</h2><div class="list scroll"><table><tr><th>경로</th><th class="num">상담 건</th><th class="num">전환</th></tr>' +
    CV.bySource.map(function(x){ return '<tr><td><b>' + esc(x.source) + '</b></td><td class="num">' + x.rows + '</td><td class="num"><b>' + x.conv + '</b></td></tr>'; }).join('') + '</table></div>';
  cs += '<details class="fold"><summary>읽을 때 주의</summary><div class="list" style="margin-top:8px">' + CV.notes.map(function(n){ return item(null, '', n); }).join('') + '</div></details>';
  document.getElementById('s-consult').innerHTML = cs;

  /* ---------- 광고 마케팅 예정 ---------- */
  var dated = W.plans.filter(function(p){ return p.date; }).sort(function(a,b){ return a.date < b.date ? -1 : 1; }), open = W.plans.filter(function(p){ return !p.date; });
  var planItem = function(p){ return item(null, p.title, p.why, ['<span class="chip">' + esc(p.channel) + '</span>', '<span class="chip' + (p.status === '대기' ? ' old' : '') + '">' + esc(p.status) + '</span>'].concat(p.est ? ['<span class="chip old">날짜 추정</span>'] : [])); };
  var dg = {}; dated.forEach(function(p){ (dg[p.date] = dg[p.date] || []).push(p); });
  /* 클래스 마감 + 매일 홍보 일정 (노션 1주차 = 모집 마감) */
  var PR = W.promo, PC = {}, dd = function(d){ return Math.round((new Date(d + 'T00:00:00') - new Date(now.getFullYear(), now.getMonth(), now.getDate())) / 864e5); };
  PR.classes.forEach(function(c){ PC[c.key] = c; });
  var CHC = {'카톡':'t-ld','커뮤니티':'t-tr','스티비':'ok','광고':'t-bo'};
  var chChip = function(ch){ return ch.split(' + ').map(function(x){ return '<span class="chip ' + (CHC[x] || '') + '">' + esc(x) + '</span>'; }).join(' '); };
  // 클래스: 국가(한중일/한국/중국/일본) 블록 → 그 안에서 모집 중 / 오픈 예정 / 마감. 마감 = 노션 1주차(또는 판매 페이지 마감일)
  var MKS = ['한중일','한국','중국','일본'], MKC = {'한중일':'var(--bad)','한국':'var(--good)','중국':'var(--warn)','일본':'var(--accent)'};
  var stOf = function(c){ return dd(c.deadline) < 0 ? 'closed' : c.status === 'upcoming' ? 'upcoming' : 'open'; };
  var STG = [['open','모집 중','ok'],['upcoming','오픈 예정','old'],['closed','마감 · 수업 진행 중','']];
  var clsRow = function(c){
    var n = dd(c.deadline), st = stOf(c), urgent = st !== 'closed' && n <= 3;
    var badge = st === 'closed' ? '마감' : n === 0 ? '오늘 마감' : 'D-' + n;
    return '<div class="item" style="align-items:center' + (st === 'closed' ? ';opacity:.6' : '') + '"><div class="body"><div class="t"><b>' + esc(c.name) + '</b></div>' +
      '<div class="note">' + esc(c.note) + '</div><div class="chips"><span class="chip' + (c.kind === '무료특강' ? ' t-tr' : '') + '">' + esc(c.kind) + '</span>' + (c.open ? '<span class="chip">오픈 ' + md(c.open).split(' ')[0] + '</span>' : '') + '</div></div>' +
      '<div style="text-align:right;flex:none;min-width:92px"><div style="font-size:1.05rem;font-weight:700' + (urgent ? ';color:var(--bad)' : '') + '">' + badge + '</div><div class="sub">마감 ' + md(c.deadline) + '</div></div></div>';
  };
  var sorted = PR.classes.slice().sort(function(a,b){ return a.deadline < b.deadline ? -1 : 1; });
  var pr = '<h2>' + dot('var(--bad)') + '클래스 오픈 · 마감 (1주차 = 마감)</h2>' +
    '<div class="chips" style="margin:0 0 4px">' + MKS.map(function(m){ var k = sorted.filter(function(c){ return c.mk === m && stOf(c) !== 'closed'; }).length; return '<a class="chip" href="#mk-' + m + '" style="text-decoration:none;font-size:.78rem;padding:3px 10px"><span class="dot" style="display:inline-block;width:7px;height:7px;border-radius:50%;background:' + MKC[m] + ';margin-right:5px"></span>' + m + ' ' + k + '</a>'; }).join('') + '</div>' +
    MKS.map(function(m){
      var cs = sorted.filter(function(c){ return c.mk === m; });
      if (!cs.length) return '';
      var live = cs.filter(function(c){ return stOf(c) !== 'closed'; }).length;
      return '<h2 id="mk-' + m + '" style="font-size:.95rem;color:var(--fg);margin-top:20px;scroll-margin-top:110px">' + dot(MKC[m]) + m + ' <span class="sub" style="font-weight:500">모집 중·예정 ' + live + '개</span></h2><div class="list" style="border-left:4px solid ' + MKC[m] + '">' +
        STG.map(function(g){
          var xs = cs.filter(function(c){ return stOf(c) === g[0]; });
          if (g[0] === 'closed') xs.reverse();
          return xs.length ? '<div class="day-h"><span class="chip ' + g[2] + '">' + g[1] + '</span> ' + xs.length + '개</div>' + xs.map(clsRow).join('') : '';
        }).join('') + '</div>';
    }).join('') + '<p class="hint">' + esc(PR.source) + ' · 중국·일본 초급반은 판매 페이지 마감일 · ' + esc(PR.asOf) + ' 조회. 오픈 예정은 오픈일을 알려 주시면 넣겠습니다.</p>';
  var EV = {}; PR.events.forEach(function(e){ (EV[e.date] = EV[e.date] || []).push(e.title); });
  var weeks = {}; PR.days.forEach(function(x){ var d = new Date(x.date + 'T00:00:00'); var mon = new Date(d.getFullYear(), d.getMonth(), d.getDate() - ((d.getDay() + 6) % 7)); var k = mon.getFullYear() + '-' + String(mon.getMonth()+1).padStart(2,'0') + '-' + String(mon.getDate()).padStart(2,'0'); (weeks[k] = weeks[k] || []).push(x); });
  pr += '<h2>' + dot('var(--accent)') + '매일 홍보 일정 · 하루 1건, 매번 다르게</h2>';
  Object.keys(weeks).sort().forEach(function(k, wi){
    var xs = weeks[k], lastD = xs[xs.length - 1].date, past = dd(lastD) < 0, cur = dd(k) <= 0 && dd(lastD) >= 0;
    var body = '<div class="list">' + xs.map(function(x){
      var c = PC[x.cls], n = dd(x.date), cd = Math.round((new Date(c.deadline + 'T00:00:00') - new Date(x.date + 'T00:00:00')) / 864e5);
      return '<div class="item"' + (n < 0 ? ' style="opacity:.55"' : n === 0 ? ' style="background:var(--warn-bg)"' : '') + '><div class="body"><div class="t">' + md(x.date) + (n === 0 ? ' · 오늘' : '') + ' — ' + esc(c.name) + ' <span class="sub">(마감 ' + (cd > 0 ? 'D-' + cd : cd === 0 ? '당일' : '지남') + ')</span></div>' +
        '<div class="note">' + esc(x.what) + '</div><div class="chips">' + chChip(x.channel) + (EV[x.date] ? EV[x.date].map(function(e){ return '<span class="chip">📅 ' + esc(e) + '</span>'; }).join('') : '') + '</div></div></div>';
    }).join('') + '</div>';
    var label = md(k).split(' ')[0] + ' 주' + (cur ? ' · 이번 주' : '');
    var upcoming = Object.keys(weeks).sort().filter(function(w){ return dd(weeks[w][weeks[w].length - 1].date) >= 0; });
    pr += !past && upcoming.indexOf(k) >= 0 && upcoming.indexOf(k) <= 1 ? '<h2 style="font-weight:500">' + label + '</h2>' + body : '<details class="fold" style="margin-top:10px"' + '><summary>' + label + ' · ' + xs.length + '건</summary><div style="margin-top:8px">' + body + '</div></details>';
  });
  pr += '<h2>' + dot('var(--muted-2)') + '광고 (상시)</h2><div class="list">' + PR.ads.map(function(a){ return item(null, a.what, md(a.from).split(' ')[0] + ' ~ ' + md(a.to).split(' ')[0]); }).join('') + '</div>';
  pr += '<details class="fold"><summary>일정 짠 기준</summary><div class="list" style="margin-top:8px">' + PR.rules.map(function(n){ return item(null, '', n); }).join('') + '</div></details>';
  document.getElementById('s-promo').innerHTML = pr;
  var pl = '<h2>' + dot('var(--accent)') + '날짜가 정해진 것</h2><div class="list">' + Object.keys(dg).sort().map(function(d){
    var diff = Math.round((new Date(d + 'T00:00:00') - new Date(now.getFullYear(), now.getMonth(), now.getDate())) / 864e5);
    return '<div class="day-h">' + md(d) + (diff === 0 ? ' · 오늘' : diff > 0 ? ' · D-' + diff : ' · 지남') + '</div>' + dg[d].map(planItem).join('');
  }).join('') + '</div>';
  pl += '<h2>' + dot('var(--muted-2)') + '날짜 미정 · 판단 대기</h2><div class="list">' + open.map(planItem).join('') + '</div>';
  document.getElementById('s-plan').innerHTML = pl;

  /* ---------- 탭 ---------- */
  var TABS = [['report','광고 효율 보고서'],['remind','업무 리마인드'],['daily','일간 업무'],['consult','상담 전환'],['promo','홍보 일정'],['plan','광고 마케팅 예정']];
  var tabs = document.getElementById('tabs');
  tabs.innerHTML = TABS.map(function(t){ return '<button role="tab" type="button" data-t="' + t[0] + '">' + t[1] + '</button>'; }).join('');
  var show = function(id){
    TABS.forEach(function(t){ document.getElementById('s-' + t[0]).classList.toggle('on', t[0] === id); });
    [].forEach.call(tabs.children, function(b){ b.setAttribute('aria-selected', b.dataset.t === id); });
    try { localStorage.setItem('work-check-tab', id); } catch (e) {}
  };
  tabs.addEventListener('click', function(e){ var b = e.target.closest('button'); if (b) show(b.dataset.t); });
  window.addEventListener('hashchange', function(){ var h = location.hash.slice(1); if (TABS.some(function(t){ return t[0] === h; })) { show(h); window.scrollTo(0, 0); } });
  var start = (location.hash || '').slice(1); if (!TABS.some(function(t){ return t[0] === start; })) { try { start = localStorage.getItem('work-check-tab'); } catch (e) {} }
  show(TABS.some(function(t){ return t[0] === start; }) ? start : 'report');

  /* ---------- 체크 → 복사 ---------- */
  var bar = document.getElementById('copybar');
  var refresh = function(){ var n = Object.keys(local).length; bar.classList.toggle('on', n > 0); document.getElementById('copymsg').textContent = n + '개 완료 표시 (노션 미반영)'; };
  document.addEventListener('change', function(e){
    var cb = e.target; if (!cb.dataset || !cb.dataset.id) return;
    if (cb.checked) local[cb.dataset.id] = cb.dataset.title; else delete local[cb.dataset.id];
    cb.closest('.item').classList.toggle('local', cb.checked); save(); refresh();
  });
  document.getElementById('copybtn').addEventListener('click', function(){
    var txt = '노션 ' + W.meta.dayPage.title + ' 페이지에서 아래 항목 완료 체크해줘:\n' + Object.keys(local).map(function(k){ return '- ' + local[k]; }).join('\n');
    var btn = document.getElementById('copybtn'), box = document.getElementById('copybox');
    var done = function(){ btn.textContent = '복사됨'; setTimeout(function(){ btn.textContent = '완료 목록 복사'; }, 1500); };
    var fallback = function(){ box.value = txt; box.hidden = false; box.focus(); box.select(); document.getElementById('copymsg').textContent = '아래 글을 선택해 복사(Ctrl+C)하세요'; };
    try { if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(txt).then(done, fallback); else fallback(); } catch (e) { fallback(); }
  });
  refresh();
})();
</script>
<div class="zoom" id="zoom"><img alt=""></div>
<script>
(function(){var z=document.getElementById('zoom');document.addEventListener('click',function(e){if(e.target.matches('.adcard .shot img')){z.querySelector('img').src=e.target.src;z.classList.add('on');}else if(e.target.closest('#zoom')){z.classList.remove('on');}});})();
</script>
</body>
